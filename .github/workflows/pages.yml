# Публикация книги на GitHub Pages.
#
# При каждом изменении в ветке main книга пересобирается из глав и выкладывается
# по адресу вида https://<пользователь>.github.io/living-project-book/
#
# В настройках репозитория: Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Deploy book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Пересобираем книгу из глав: так на сайте всегда актуальная версия.
      - name: Assemble book
        run: node scripts/assemble-book.js --book=Landing-book --write

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Landing-book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
